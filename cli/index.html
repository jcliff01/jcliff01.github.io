<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101418">
<meta name="description" content="Explore Jake's engineering portfolio through a browser terminal.">
<title>Jake / Portfolio CLI</title>
<style>
:root{color-scheme:dark;--bg:#101418;--panel:#151c22;--line:#34424b;--text:#e8eef1;--quiet:#a9bac4;--accent:#8debd1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,sans-serif}
.shell{width:min(950px,calc(100% - 32px));margin:clamp(28px,9vh,100px) auto}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
h1{font-size:1.35rem;margin:0}a{color:var(--accent);text-underline-offset:4px}
.terminal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:clamp(14px,4vw,30px);font:1rem/1.65 ui-monospace,Consolas,monospace;overflow:hidden}
.terminal a{overflow-wrap:anywhere}.intro{margin:0 0 16px;color:var(--quiet)}.prompt{color:var(--accent);white-space:nowrap}
form{display:flex;align-items:center;gap:9px;margin:0}
input{flex:1;min-width:0;width:0;background:transparent;color:var(--text);font:inherit;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#command{appearance:none;outline:none;box-shadow:none;caret-color:var(--accent)}
#output{max-height:min(52vh,450px);overflow:auto;overflow-wrap:anywhere;white-space:pre-wrap}
.entry{margin:0 0 15px}.entry p,.entry ul,.entry dl{margin:3px 0 0}.entry ul{padding-left:24px}
.entry dl{white-space:normal}.entry dt{color:var(--accent)}.entry dd{margin:0 0 7px}
</style>
</head>
<body>
<main class="shell">
<header><h1>Jake / Portfolio CLI</h1><a href="/">Main site</a></header>
<section class="terminal" aria-label="Portfolio terminal">
<p class="intro">Principal engineer · Infrastructure, communications, and automation.</p>
<p class="intro">Type <strong>help</strong> or <strong>?</strong> and press Enter.</p>
<div id="output" role="log" aria-label="Terminal output" aria-live="polite"></div>
<form id="terminal-form">
<label class="prompt" for="command">guest@jcliff01:~$</label>
<input id="command" aria-label="Command" spellcheck="false" autocomplete="off" autocapitalize="none" enterkeyhint="enter" maxlength="120">
</form>
<noscript><p>Enable JavaScript to use the terminal. <a href="/">Browse Jake’s main site</a>.</p></noscript>
</section>
</main>
<script>
"use strict";
const output = document.querySelector("#output");
const input = document.querySelector("#command");
const history = [];
let historyPosition = 0;
let draft = "";
const commands = new Map([
  ["help", ["List commands and keyboard shortcuts."]],
  ["about", ["Read about Jake’s engineering work.", "I’m Jake, a principal engineer at ConvergeOne. I work on enterprise communications, cloud infrastructure, network operations, and automation. My focus is building and supporting reliable systems."]],
  ["projects", ["Browse Jake’s projects and community work.", [
    ["Agent Mon", "Cisco Finesse connectivity diagnostics prototype.", "https://github.com/jcliff01/agent-mon"],
    ["CUBE CDR Reader", "Windows tool for searching Cisco CUBE call accounting records.", "https://github.com/jcliff01/CUBE-CDR-Reader"],
    ["VoipStudio", "Windows desktop and command-line tools for inspecting VoIP signaling in packet captures. Conceived and created by Bastian74, a coworker Jake follows on GitHub. Jake uses this tool.", "https://github.com/jcliff01/VoipStudio"],
    ["RTMT Plus", "Early-stage tool for searching Cisco CUCM RTMT logs and correlating events across nodes.", "https://github.com/jcliff01/RTMT-Plus"],
    ["CubeScope", "C# source snapshot for Cisco CUBE log and call-record analysis. Conceived and created by Bastian74, a coworker Jake follows on GitHub. Jake uses this tool.", "https://github.com/jcliff01/CUBEScape"],
    ["Genesys Cloud WebRTC Phone", "Single-call browser phone prototype for signed-in Genesys Cloud users.", "https://github.com/jcliff01/WebRTC-dev"],
    ["Genesys Cloud OAuth Connector", "Node.js module for adding Genesys Cloud OAuth to a website backend.", "https://github.com/jcliff01/oauth-connector"],
    ["MCP in Motion", "Browser animation showing how a Model Context Protocol host and server exchange messages.", "https://github.com/jcliff01/mcp-dev"],
    ["Gaman — Hoi An Deserves Peace", "Bilingual community campaign for considerate chicken keeping and quieter neighborhoods in Hội An.", "https://jcliff01.github.io/gaman/"]
  ]]],
  ["github", ["Open Jake’s GitHub profile.", [["jcliff01 on GitHub", "", "https://github.com/jcliff01"]]]],
  ["site", ["Find the main engineering portfolio.", [["Jake’s main site", "", "/"]]]],
  ["clear", ["Clear terminal output."]]
]);
function element(tag, text) {
  const node = document.createElement(tag);
  node.textContent = text;
  return node;
}
function run(raw) {
  const command = raw.trim().toLowerCase();
  if (!command) {
    const line = element("div", "guest@jcliff01:~$");
    line.className = "prompt";
    output.append(line);
    output.scrollTop = output.scrollHeight;
    return;
  }
  history.push(raw.trim());
  historyPosition = history.length;
  draft = "";
  if (command === "clear") {
    output.replaceChildren();
    return;
  }
  const entry = element("div", "");
  entry.className = "entry";
  const prompt = element("span", "guest@jcliff01:~$ ");
  prompt.className = "prompt";
  entry.append(prompt, document.createTextNode(raw.trim()));
  if (command === "help" || command === "?") {
    const list = element("dl", "");
    for (const [name, [description]] of commands) {
      list.append(element("dt", name), element("dd", description));
    }
    entry.append(list, element("p", "Tab completes a unique command. ↑ and ↓ recall commands."));
  } else {
    const result = commands.get(command)?.[1];
    if (Array.isArray(result)) {
      const list = element("ul", "");
      for (const [label, description, url] of result) {
        const item = element("li", "");
        const link = element("a", label);
        link.href = url;
        item.append(link);
        if (description) item.append(" — " + description);
        list.append(item);
      }
      entry.append(list);
    } else {
      entry.append(element("p", result ?? "Command not found. Type help for available commands."));
    }
  }
  output.append(entry);
  output.scrollTop = output.scrollHeight;
}
document.querySelector("#terminal-form").addEventListener("submit", event => {
  event.preventDefault();
  const line = input.value;
  input.value = "";
  run(line);
  input.focus({preventScroll: true});
});
input.addEventListener("keydown", event => {
  if (event.isComposing) return;
  if (event.key === "Tab" && !event.shiftKey) {
    const prefix = input.value.trim().toLowerCase();
    if (!prefix) return;
    const matches = [...commands.keys()].filter(name => name.startsWith(prefix));
    if (matches.length === 1 && matches[0] !== prefix) {
      event.preventDefault();
      input.value = matches[0];
    }
    return;
  }
  if (event.key !== "ArrowUp" && event.key !== "ArrowDown") return;
  event.preventDefault();
  if (historyPosition === history.length) draft = input.value;
  historyPosition = Math.max(0, Math.min(history.length,
    historyPosition + (event.key === "ArrowUp" ? -1 : 1)));
  input.value = history[historyPosition] ?? draft;
});
if (window.matchMedia("(pointer: fine)").matches) {
  input.focus({preventScroll: true});
}
</script>
</body>
</html>
